<!DOCTYPE html>
<html lang="ckb" dir="rtl" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#4c1d95">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ئاماری ساحە">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ئاماری ساحە بەرمیل، کیسە</title>
<style>
:root{--bg:#f6f4fd;--card:#fff;--tx:#0f172a;--mu:#64748b;--ac:#4c1d95;--bd:#c4ccd6;--hv:#f5f3ff;--ok:#0891b2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--card:#1a1e3a;--tx:#e8eaf6;--mu:#9aa3c7;--ac:#7c5cd6;--bd:#2f3560;--hv:#232850;--ok:#38bdf8}}
:root[data-theme="dark"]{--bg:#0f1226;--card:#1a1e3a;--tx:#e8eaf6;--mu:#9aa3c7;--ac:#7c5cd6;--bd:#2f3560;--hv:#232850;--ok:#38bdf8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",Tahoma,Arial,sans-serif;padding:12px}
h1{font-size:18px;margin:4px 0 2px}.sub{color:var(--mu);font-size:12px;margin-bottom:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}.top h1{margin:0;flex:1}.top #syncst{margin:0;flex:0 1 auto;max-width:55%;text-align:center}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:700}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{background:var(--ac);color:#fff;border-radius:12px;padding:10px;display:grid;gap:8px}
.bar label{font-size:12px;opacity:.85;display:block}
.bar select,.bar input{width:100%;padding:8px;border-radius:8px;border:0;font:inherit;background:#fff;color:#0f172a}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid #fff8;background:transparent;color:#fff;font:inherit;font-size:13px}
.chip.on{background:#fff;color:var(--ac);font-weight:700}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.cards.c3{grid-template-columns:repeat(3,1fr);gap:6px}.c3 .card{padding:8px 4px}.c3 .card b{font-size:17px}.c3 .card span{font-size:11px;line-height:1.3;display:block}
.card.wide{grid-column:1/-1}.card b{display:block;font-size:20px;margin-top:2px}.card span{font-size:12px;color:var(--mu)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:10px 0;overflow-x:auto}
.box h2{font-size:13px;margin:0;padding:8px 10px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--ac);color:#fff;padding:8px 6px;font-weight:700;white-space:nowrap}
td{padding:8px 6px;text-align:center;border-top:1px solid var(--bd);white-space:nowrap}
tr:hover td{background:var(--hv)}
.empty{padding:14px;text-align:center;color:var(--mu)}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin-top:12px}
summary{font-weight:700}
textarea{width:100%;height:120px;direction:ltr;font:12px monospace;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px;margin:8px 0}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns button,.btns label{padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:13px}
.note{font-size:12px;color:var(--mu);margin:6px 0}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:12px 0}
.panel h2{font-size:14px;margin:0 0 8px;color:var(--ac)}
.panel label{font-size:12px;color:var(--mu);display:block}
.panel input{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx)}
.panel .row2{margin-top:8px}
.panel .cards{margin:8px 0}
.sp{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.sp button{padding:6px 12px;border-radius:99px;border:1px solid var(--ac);background:transparent;color:var(--ac);font:inherit;font-size:13px}
.sp button.on{background:var(--ac);color:#fff}
.go{width:100%;margin-top:10px;padding:10px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:700}
.x{border:0;background:none;color:#dc2626;padding:6px 10px;line-height:0}
#rbtn{width:100%;margin:0 0 8px;padding:10px;border:1px solid var(--ac);background:var(--card);color:var(--ac);border-radius:10px;font:inherit;font-weight:700}
#rbtn.on{background:var(--ac);color:#fff}
body.repon #chipsW,body.repon #perW,body.repon #addBtn,body.repon #panel{display:none!important}
.rp h3{margin:0;padding:10px 12px;font-size:15px;color:var(--ac);border-bottom:1px solid var(--bd)}
.rp .ttl{padding:12px;text-align:center}.rp .ttl b{display:block;font-size:17px;color:var(--ac)}.rp .ttl span{font-size:13px;color:var(--mu)}
.rp td.n{font-weight:700}.rp td .spc{display:inline-block;padding:2px 12px;border-radius:99px;border:1px solid var(--ac);color:var(--ac);font-weight:700}
.rp tr.grp td{background:var(--hv);font-weight:700;color:var(--ac);border-top:1px solid var(--ac)}
.rp tr.tot td{background:#047857;color:#fff;font-weight:700;border-top:1px solid #047857}
.rp .none{padding:14px;text-align:center;color:var(--mu)}
#view .sh{display:grid;gap:8px;padding:12px}
#view .sh .r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#view .sh .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#view .sh button{padding:12px 6px;border:0;border-radius:10px;color:#fff;font:inherit;font-weight:700;font-size:14px}
#view .sh .b-sys{background:var(--ac);font-size:16px}#view .sh .b-sys small{font-weight:400;opacity:.85;font-size:12px}
#view .sh .b-wa{background:#25D366;color:#073b1a}#view .sh .b-tg{background:#229ED9}#view .sh .b-vb{background:#7360F2}
#view .sh .b-sv{background:#0f766e}
#view .sh .b-cp{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
#view .wl{padding:0 12px 8px;font-size:12px;color:var(--mu)}
#view .wn{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 12px}
#view .wn .wc{display:flex;border-radius:10px;overflow:hidden;background:#25D366}
#view .wn .wc button{border:0;background:none;color:#073b1a;font:inherit;font-weight:700;font-size:13px;padding:8px 12px}
#view .wn .wc button small{font-weight:400;opacity:.8;margin-inline-start:4px}
#view .wn .wc .wx{padding:8px 10px;background:#0000002b}
#view .wn .wadd{border:1px dashed #25D366;background:transparent;color:#128c3e;border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;font-size:13px}
body.adding .bar,body.adding #view{display:none}
#dlg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
#dlg.show{display:flex}
#dlg .bx{background:#fff;color:#0f172a;border-radius:16px;padding:20px;width:100%;max-width:340px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#dlg .tx{font-size:16px;font-weight:600;margin-bottom:16px;line-height:1.6}
#dlg .bt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#dlg button{padding:12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;color:#0f172a;font:inherit;font-size:15px;font-weight:600}
#dlg button#dlgY{background:#dc2626;border-color:#dc2626;color:#fff}
#syncst{display:inline-block;font-size:12px;padding:3px 12px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mu);margin:0 0 8px;cursor:pointer}
#syncst[data-c=k]{color:#047857;border-color:#047857}#syncst[data-c=e]{color:#dc2626;border-color:#dc2626}#syncst[data-c=o]{color:#b45309;border-color:#b45309}#syncst[data-c=s]{color:#2563eb;border-color:#2563eb}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1e1b4b;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center;box-shadow:0 4px 16px #0006}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="top"><h1>ئاماری ساحە بەرمیل، کیسە</h1>
<div id="syncst" data-c="n">...</div></div>
<div class="tabs"><button id="t1" class="on">ئاماری ڕۆشتوو</button><button id="t2">ئاماری ناو ساحە</button></div>
<button id="rbtn">📋 ڕاپۆرتی گشتی</button>

<div class="bar">
  <div class="row2" id="rg"><div><label>لە</label><input type="date" id="from"></div><div><label>تا</label><input type="date" id="to"></div></div>
  <div id="perW"><label>جۆری ڕاپۆرت</label><select id="per"><option value="d">ڕۆژانە</option><option value="m">مانگانە</option></select></div>
  <div id="chipsW"><label>جۆری بار (کرتە بکە بۆ مواسەفات)</label><div class="chips" id="chips"></div></div>
</div>

<div id="toast"></div>
<div id="dlg"><div class="bx"><div class="tx" id="dlgT"></div><input id="dlgI" type="text" autocomplete="off" style="display:none;width:100%;padding:10px;margin:-6px 0 14px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;font-size:15px;background:#fff;color:#0f172a"><div class="bt"><button id="dlgY">بەڵێ</button><button id="dlgN">نەخێر</button></div></div></div>
<button class="go" id="addBtn">داخڵکردنی ڕۆشتووەکان</button>
<div id="panel" class="panel" hidden></div>
<div id="view"></div>
<details id="bk"><summary>💾 پاشەکەوتکردن و گواستنەوەی داتا</summary>
<div class="note">داتاکان لەسەر هەمان مۆبایل و هەمان وێبگەڕ دەمێننەوە. بۆ گواستنەوە بۆ شوێنێکی تر، هەناردەی بکە و لەوێ بیهێنەوە.</div>
<div class="btns"><button id="bkE">📤 هەناردەکردن</button><label>📥 هێنان<input type="file" id="bkI" accept=".json,application/json" hidden></label></div></details>



<script>
const $=id=>document.getElementById(id);
let D={manifests:[],pool:[],manual:[],specs:{},avg:{}},tab=1,picks=new Set(),repOn=false,reportText='',reportRows=[],reportLbl='';
const fmt=n=>Math.round(Number(n)||0).toLocaleString('en-US');
const dayKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const toD=s=>{const d=new Date(s);return isNaN(d)?new Date(0):d};

// ---- unit classification (same rule as the desktop program, simplified spelling folds) ----
const fold=s=>(s||'').toLowerCase().replace(/[ةە]/g,'ه').replace(/[ىيێې]/g,'ی').replace(/[ۆؤ]/g,'و').replace(/[أإآ]/g,'ا').replace(/ك/g,'ک').replace(/ڵ/g,'ل').replace(/ڕ/g,'ر').replace(/ـ/g,'');
const BAG=['کیسه','جامبو','جمبو','جهمبو','بیگباگ','بگباگ','kisa','kysa','kise','kesa','jambo','jumbo','jambu','bigbag'];
const BAR=['بهرمیل','barmil','barmyl','barrel'];
const TNK=['تانکهر','تهنکهر','فهل','tankar','tanker','fal'];
const PAL=['پالیت','پلیت','بالیت','palet','pallet','plet','balet'];
function dl(a,b){const n=a.length,m=b.length,d=Array.from({length:n+1},(_,i)=>[i,...Array(m).fill(0)]);for(let j=0;j<=m;j++)d[0][j]=j;
 for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){let c=a[i-1]===b[j-1]?0:1,v=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
  if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,d[i-2][j-2]+1);d[i][j]=v}return d[n][m]}
const close=(w,r)=>dl(w,r)<=(r.length<=4?1:2);
const sq=s=>s.replace(/[^\p{L}]/gu,''),words=s=>s.split(/[^\p{L}]+/u).filter(w=>w.length>=3);
const memo={};
function isPallet(u){const n=fold((u||'').trim());if(!n)return false;const s=sq(n);
 return PAL.some(r=>s.includes(r))||words(n).some(w=>PAL.slice(3).some(r=>close(w,r)))}
function cls(u){if(u in memo)return memo[u];const r=(u||'').trim();let k='tanker';
 if(r){const n=fold(r),s=sq(n);
  if(BAG.some(x=>s.includes(x)))k='bags';else if(BAR.some(x=>s.includes(x)))k='barrels';
  else if(isPallet(r))k='barrels';else if(TNK.some(x=>s.includes(x)))k='tanker';
  else{const c=words(n);if(s.length>=3)c.push(s);
   for(const w of c){if(BAG.some(x=>close(w,x))){k='bags';break}if(BAR.some(x=>close(w,x))){k='barrels';break}}}}
 return memo[u]=k}
const barrelQty=x=>(+x.Quantity||0)*(isPallet(x.Unit)?4:1);
const BAGI='<svg viewBox="0 0 48 48" width="1.25em" height="1.25em" style="vertical-align:-.3em" aria-hidden="true"><g stroke="#1e3a5f" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M13 19V8.5Q13 5.5 16 6Q19 6.5 19 9.5V21" fill="none" stroke-width="2.7"/><path d="M29 21V9.5Q29 6.5 32 6Q35 5.5 35 8.5V19" fill="none" stroke-width="2.7"/><path d="M10 16L24 11L38 16L24 21Z" fill="#2b2b2b"/><path d="M10 16L24 21V45L10 40Z" fill="#f4f4f2"/><path d="M24 21L38 16V40L24 45Z" fill="#dcdcd7"/><path d="M10 23L24 28L38 23" fill="none" stroke="#2c5282" stroke-width="2.2"/></g></svg>';
const TRASH='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M5 6l1 14a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-14"/><path d="M10 11v6M14 11v6"/></svg>';
const NAME={barrels:'بەرمیل',bags:'کیسە'};

// ---- date window ----
function win(){
 const f=$('from').value?toD($('from').value+'T00:00'):null,t=$('to').value?toD($('to').value+'T23:59:59'):null;
 return d=>(!f||d>=f)&&(!t||d<=t)}
const done=()=>D.manifests.filter(x=>!x.IsDeleted&&String(x.Status).toLowerCase()==='completed');

// ---- بەشی دەستی: مواسەفاتی قیر (بەرمیل / کیسە) ----
const KIND={'بەرمیل':'barrels','کیسە':'bags'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nz=s=>s.replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/\s+/g,' ').trim();
let sel='',addOpen=false,subSel='';
const SB={cage:'جامبۆ قەفەز',nocage:'جامبۆ بێ قەفەز'};
function ask(m,cb){const d=$('dlg');$('dlgT').textContent=m;d.classList.add('show');
 const close=()=>d.classList.remove('show');
 $('dlgY').onclick=()=>{close();cb()};$('dlgN').onclick=close;d.onclick=e=>{if(e.target===d)close()}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2800)}

function outgoing(){
 const inW=win(),pk=$('per').value==='m'?d=>dayKey(d).slice(0,7):dayKey;
 let rows=done().filter(x=>cls(x.Unit)!=='tanker'),mn=D.manual.filter(e=>e.dir==='out');
 if(picks.size){rows=rows.filter(x=>picks.has(NAME[cls(x.Unit)]));mn=mn.filter(e=>picks.has(NAME[e.kind]))}
 const g={barrels:[0,0,0],bags:[0,0,0]};
 rows.forEach(x=>{const k=cls(x.Unit),a=g[k];a[0]++;a[1]+=+x.NetWeight||0;a[2]+=k==='barrels'?barrelQty(x):(+x.Quantity||0)});
 mn.forEach(e=>{const a=g[e.kind];a[0]+=e.cars;a[1]+=e.tons;a[2]+=e.qty});
 const by={},add=(d,c,t,b,s)=>{const r=by[pk(d)]??=[0,0,0,0];r[0]+=c;r[1]+=t;r[2]+=b;r[3]+=s};
 rows.filter(x=>inW(toD(x.InvoiceDate))).forEach(x=>{const k=cls(x.Unit);add(toD(x.InvoiceDate),1,+x.NetWeight||0,k==='barrels'?barrelQty(x):0,k==='bags'?+x.Quantity||0:0)});
 mn.filter(e=>inW(toD(e.date+'T00:00'))).forEach(e=>add(toD(e.date+'T00:00'),e.cars,e.tons,e.kind==='barrels'?e.qty:0,e.kind==='bags'?e.qty:0));
 const body=Object.keys(by).sort().map(k=>[k,...by[k].map(fmt)]);
 return cards([['کۆی کێشی سافی (کگم)',fmt(g.barrels[1]+g.bags[1])],['کۆی بەرمیل',fmt(g.barrels[2])],['کۆی کیسە',fmt(g.bags[2])]],false,-1,true)+
  tbl('',['جۆری بار','ئۆتۆمبیل','کێشی سافی (کگم)','عەدەد'],[['🛢 بەرمیل',...g.barrels.map(fmt)],[BAGI+' کیسە',...g.bags.map(fmt)]])+
  tbl('بەپێی بەروار',['بەروار','ئۆتۆمبیل','کێشی سافی (کگم)','بەرمیل','کیسە'],body)}

// ---- ئاماری ناو ساحە: ماوە = داخڵبوو − ڕۆشتوو (هێنراو + دەستی) ----
function yard(){
 const inW=()=>true,bag=c=>String(c.ItemType||'').trim()==='کیسە',tk=c=>String(c.ItemType||'').trim()==='تەنکەر';
 const T={barrels:[0,0],bags:[0,0]};
 D.pool.filter(c=>!String(c.TransferTo||'').trim()&&!tk(c)&&+c.Quantity>0&&+c.UnitKg>0&&inW(toD(c.SavedDate))).forEach(c=>{const a=T[bag(c)?'bags':'barrels'];a[0]+=c.Quantity*c.UnitKg;a[1]+=+c.Quantity});
 done().filter(x=>inW(toD(x.InvoiceDate))).forEach(x=>{const k=cls(x.Unit);if(k==='tanker')return;const a=T[k];a[0]-=+x.NetWeight||0;a[1]-=k==='barrels'?barrelQty(x):(+x.Quantity||0)});
 D.manual.filter(e=>inW(toD(e.date+'T00:00'))).forEach(e=>{const a=T[e.kind],s=e.dir==='yard'?1:-1;a[0]+=s*e.tons;a[1]+=s*e.qty});
 const avg=(n,q)=>q>0?(n/q).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'0';
 const ks=['barrels','bags'],pk=picks.size?KIND[[...picks][0]]:'';
 const CARDS3=cards([['کۆی کێش (کگم)',fmt(T.barrels[0]+T.bags[0])],['کۆی بەرمیل',fmt(T.barrels[1])],['کۆی کیسە',fmt(T.bags[1])]],false,-1,true);
 if(pk){
  const G={};
  D.manual.filter(e=>e.kind===pk).forEach(e=>{const g=G[e.spec+'|'+(e.sub||'')]??={s:e.spec,u:e.sub||'',q:0,t:0},m=e.dir==='yard'?1:-1;g.q+=m*e.qty;g.t+=m*e.tons});
  const R=Object.values(G).sort((a,b)=>String(a.s).localeCompare(String(b.s))||String(a.u).localeCompare(String(b.u)));
  const rq=T[pk][1]-R.reduce((s,g)=>s+g.q,0),rt=T[pk][0]-R.reduce((s,g)=>s+g.t,0);
  if(rq||Math.abs(rt)>=1)R.push({s:'بێ مواسەفات',u:'',q:rq,t:rt});
  const bg=pk==='bags',rows=R.map(g=>[esc(g.s),...(bg?[g.u?(SB[g.u]||esc(g.u)):'-']:[]),fmt(g.q),fmt(g.t)]);

 if(v===null)return;const c=norm(v);
 if(c.length<6){toast('کۆدەکە دەبێت لانیکەم ٦ پیت یان ژمارەی ئینگلیزی بێت');return}
 if(c===CODE)return;
 const go=()=>{CODE=c;try{localStorage.setItem('sw_team',c);localStorage.removeItem('sw_sync');localStorage.removeItem('sw_bver')}catch(e){}bver=0;bulkTried=false;errMsg='';start()};
 if(CODE)ask('داتای ئەم مۆبایلە دەچێتە ناو تیمی نوێ. بەردەوام؟',go);else go()}

 push(){if(db&&CODE&&allReady()){const ops=diff(D,R);if(ops.length)run(ops)}},

</script>
<script>
/* auto-update: new code from GitHub reaches the phone without reinstalling */
if('serviceWorker' in navigator){
 let hadSW=false,reloading=false,h0=null;
 const hash=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return h};
 const grab=()=>fetch('index.html',{cache:'no-store'}).then(r=>r.ok?r.text():null).then(t=>t?hash(t):null).catch(()=>null);
 const reload=()=>{if(reloading)return;reloading=true;location.reload()};
 const busy=()=>{try{return !!addOpen}catch(e){return false}};
 const check=async(reg)=>{
  try{reg&&reg.update()}catch(e){}
  const h=await grab();
  if(h===null)return;
  if(h0===null){h0=h;return}
  if(h!==h0){ if(busy()){return} reload() }
 };
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!busy())reload()});
 addEventListener('load',()=>{
  hadSW=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
   grab().then(h=>{h0=h});
   document.addEventListener('visibilitychange',()=>{if(!document.hidden)check(reg)});
   setInterval(()=>check(reg),20*60*1000);
  }).catch(()=>{});
 });
}
</script>
