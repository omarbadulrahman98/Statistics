<script>
const $=id=>document.getElementById(id);
let D={manifests:[],pool:[],manual:[],specs:{},avg:{}},tab=1,picks=new Set(),homeOn=true,repOn=false,reportText='',reportRows=[],reportLbl='';
const fmt=n=>Math.round(Number(n)||0).toLocaleString('en-US');
const dayKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const toD=s=>{const d=new Date(s);return isNaN(d)?new Date(0):d};

// ---- unit classification (same rule as the desktop program, simplified spelling folds) ----
const fold=s=>(s||'').toLowerCase().replace(/[ةە]/g,'ه').replace(/[ىيێې]/g,'ی').replace(/[ۆؤ]/g,'و').replace(/[أإآ]/g,'ا').replace(/ك/g,'ک').replace(/ڵ/g,'ل').replace(/ڕ/g,'ر').replace(/ـ/g,'');
const BAG=['کیسه','جامبو','جمبو','جهمبو','بیگباگ','بگباگ','kisa','kysa','kise','kesa','jambo','jumbo','jambu','bigbag'];
const BAR=['بهرمیل','barmil','barmyl','barrel'];
const TNK=['تانکهر','تهنکهر','فهل','tankar','tanker','fal'];
const PAL=['پالیت','پلیت','بالیت','palet','pallet','plet','balet'];
function dl(a,b){const n=a.length,m=b.length,d=Array.from({length:n+1},(_,i)=>[i,...Array(m).fill(0)]);for(let j=0;j<=m;j++)d[0][j]=j;
 for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){let c=a[i-1]===b[j-1]?0:1,v=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
  if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,d[i-2][j-2]+1);d[i][j]=v}return d[n][m]}
const close=(w,r)=>dl(w,r)<=(r.length<=4?1:2);
const sq=s=>s.replace(/[^\p{L}]/gu,''),words=s=>s.split(/[^\p{L}]+/u).filter(w=>w.length>=3);
const memo={};
function isPallet(u){const n=fold((u||'').trim());if(!n)return false;const s=sq(n);
 return PAL.some(r=>s.includes(r))||words(n).some(w=>PAL.slice(3).some(r=>close(w,r)))}
function cls(u){if(u in memo)return memo[u];const r=(u||'').trim();let k='tanker';
 if(r){const n=fold(r),s=sq(n);
  if(BAG.some(x=>s.includes(x)))k='bags';else if(BAR.some(x=>s.includes(x)))k='barrels';
  else if(isPallet(r))k='barrels';else if(TNK.some(x=>s.includes(x)))k='tanker';
  else{const c=words(n);if(s.length>=3)c.push(s);
   for(const w of c){if(BAG.some(x=>close(w,x))){k='bags';break}if(BAR.some(x=>close(w,x))){k='barrels';break}}}}
 return memo[u]=k}
const barrelQty=x=>(+x.Quantity||0)*(isPallet(x.Unit)?4:1);
const BAGI='<svg viewBox="0 0 48 48" width="1.25em" height="1.25em" style="vertical-align:-.3em" aria-hidden="true"><g stroke="#1e3a5f" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M13 19V8.5Q13 5.5 16 6Q19 6.5 19 9.5V21" fill="none" stroke-width="2.7"/><path d="M29 21V9.5Q29 6.5 32 6Q35 5.5 35 8.5V19" fill="none" stroke-width="2.7"/><path d="M10 16L24 11L38 16L24 21Z" fill="#2b2b2b"/><path d="M10 16L24 21V45L10 40Z" fill="#f4f4f2"/><path d="M24 21L38 16V40L24 45Z" fill="#dcdcd7"/><path d="M10 23L24 28L38 23" fill="none" stroke="#2c5282" stroke-width="2.2"/></g></svg>';
const TRASH='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M5 6l1 14a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-14"/><path d="M10 11v6M14 11v6"/></svg>';
const NAME={barrels:'بەرمیل',bags:'کیسە'};

// ---- date window ----
function win(){
 const f=$('from').value?toD($('from').value+'T00:00'):null,t=$('to').value?toD($('to').value+'T23:59:59'):null;
 return d=>(!f||d>=f)&&(!t||d<=t)}
const done=()=>D.manifests.filter(x=>!x.IsDeleted&&String(x.Status).toLowerCase()==='completed');

// ---- بەشی دەستی: مواسەفاتی قیر (بەرمیل / کیسە) ----
const KIND={'بەرمیل':'barrels','کیسە':'bags'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nz=s=>s.replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/\s+/g,' ').trim();
let sel='',addOpen=false,subSel='';
const SB={cage:'جامبۆ قەفەز',nocage:'جامبۆ بێ قەفەز'},SBR={'05':'05','06':'06'};
const SUBS=k=>k==='bags'?SB:SBR,subLbl=(k,u)=>u?(SUBS(k)[u]||esc(u)):'',SORD={bags:['cage','nocage',''],barrels:['05','06','']};
function ask(m,cb){const d=$('dlg');$('dlgT').textContent=m;d.classList.add('show');
 const close=()=>d.classList.remove('show');
 $('dlgY').onclick=()=>{close();cb()};$('dlgN').onclick=close;d.onclick=e=>{if(e.target===d)close()}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2800)}

function outgoing(){
 const inW=win();
 let rows=done().filter(x=>cls(x.Unit)!=='tanker'&&inW(toD(x.InvoiceDate))),mn=D.manual.filter(e=>e.dir==='out'&&inW(toD(e.date+'T00:00')));
 if(picks.size){rows=rows.filter(x=>picks.has(NAME[cls(x.Unit)]));mn=mn.filter(e=>picks.has(NAME[e.kind]))}
 const g={barrels:[0,0,0],bags:[0,0,0]};
 rows.forEach(x=>{const k=cls(x.Unit),a=g[k];a[0]++;a[1]+=+x.NetWeight||0;a[2]+=k==='barrels'?barrelQty(x):(+x.Quantity||0)});
 mn.forEach(e=>{const a=g[e.kind];a[0]+=e.cars;a[1]+=e.tons;a[2]+=e.qty});
 return cards([['کۆی کێشی سافی (کگم)',fmt(g.barrels[1]+g.bags[1])],['کۆی بەرمیل',fmt(g.barrels[2])],['کۆی کیسە',fmt(g.bags[2])]],false,-1,true)+
  tbl('',['جۆری بار','کێشی سافی (کگم)','عەدەد'],[['🛢 بەرمیل',fmt(g.barrels[1]),fmt(g.barrels[2])],[BAGI+' کیسە',fmt(g.bags[1]),fmt(g.bags[2])]])}

// ---- ئاماری ناو ساحە: ماوە = داخڵبوو − ڕۆشتوو (هێنراو + دەستی) ----
function yardTotals(){
 const inW=()=>true,bag=c=>String(c.ItemType||'').trim()==='کیسە',tk=c=>String(c.ItemType||'').trim()==='تەنکەر';
 const T={barrels:[0,0],bags:[0,0]};
 D.pool.filter(c=>!String(c.TransferTo||'').trim()&&!tk(c)&&+c.Quantity>0&&+c.UnitKg>0&&inW(toD(c.SavedDate))).forEach(c=>{const a=T[bag(c)?'bags':'barrels'];a[0]+=c.Quantity*c.UnitKg;a[1]+=+c.Quantity});
 done().filter(x=>inW(toD(x.InvoiceDate))).forEach(x=>{const k=cls(x.Unit);if(k==='tanker')return;const a=T[k];a[0]-=+x.NetWeight||0;a[1]-=k==='barrels'?barrelQty(x):(+x.Quantity||0)});
 D.manual.filter(e=>inW(toD(e.date+'T00:00'))).forEach(e=>{const a=T[e.kind],s=e.dir==='yard'?1:-1;a[0]+=s*e.tons;a[1]+=s*e.qty});
 return T}
function yard(){
 const T=yardTotals();
 const avg=(n,q)=>q>0?(n/q).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'0';
 const ks=['barrels','bags'],pk=picks.size?KIND[[...picks][0]]:'';
 const CARDS3=cards([['کۆی کێش (کگم)',fmt(T.barrels[0]+T.bags[0])],['کۆی بەرمیل',fmt(T.barrels[1])],['کۆی کیسە',fmt(T.bags[1])]],false,-1,true);
 if(pk){
  const G={};
  D.manual.filter(e=>e.kind===pk).forEach(e=>{const g=G[e.spec+'|'+(e.sub||'')]??={s:e.spec,u:e.sub||'',q:0,t:0},m=e.dir==='yard'?1:-1;g.q+=m*e.qty;g.t+=m*e.tons});
  const R=Object.values(G).sort((a,b)=>String(a.s).localeCompare(String(b.s))||String(a.u).localeCompare(String(b.u)));
  const rq=T[pk][1]-R.reduce((s,g)=>s+g.q,0),rt=T[pk][0]-R.reduce((s,g)=>s+g.t,0);
  if(rq||Math.abs(rt)>=1)R.push({s:'بێ مواسەفات',u:'',q:rq,t:rt});
  const rows=R.map(g=>[esc(g.s),subLbl(pk,g.u)||'-',fmt(g.q),fmt(g.t)]);
  rows.push(['<b>کۆ</b>','',`<b>${fmt(T[pk][1])}</b>`,`<b>${fmt(T[pk][0])}</b>`]);
  return CARDS3+
   tbl(`${NAME[pk]} · ماوە لە ساحە بەپێی مواسەفات و نەوع`,['مواسەفات','نەوع','عەدەد','کێش (کگم)'],rows)}
 return CARDS3+
  tbl('',['جۆری بار','کێش (کگم)','عەدەد','تێکڕا'],ks.map(k=>[(k==='barrels'?'🛢 ':BAGI+' ')+NAME[k],fmt(T[k][0]),fmt(T[k][1]),avg(T[k][0],T[k][1])]))}

function panel(){
 const p=[...picks][0],el=$('panel');el.hidden=!p;if(!p)addOpen=false;document.body.classList.toggle('adding',addOpen);$('addBtn').textContent=addOpen?'داخستنی فۆڕم':(tab===1?'داخڵکردنی ڕۆشتووەکان':'زیادکردنی عەدەد');if(!p){el.innerHTML='';return}
 const k=KIND[p],y=tab===2,sp=D.specs[k]||[],inW=win(),en=D.manual.filter(e=>e.kind===k&&inW(toD(e.date+'T00:00')));

 let h=`<h2>مواسەفاتی قیر · ${p}</h2>`+(!addOpen?'':`${sb}<label>مواسەفات (نموونە 60/70)</label><input id="sp_n" value="${esc(sel)}" autocomplete="off">${sp.length?'<div class="sp" id="fsp" style="margin:8px 0 0">'+sp.map((x,n)=>`<button type="button" data-fs="${n}" class="${x===sel?'on':''}">${esc(x)}</button>`).join('')+'</div>':''}`+
 `<div class="row2"><div><label>عەدەد</label><input id="sp_q" type="number" inputmode="numeric" min="0"></div><div><label>تێکڕا · کێشی یەک ${p}</label><input id="sp_t" value="${av}" type="number" inputmode="decimal" step="any" min="0"></div></div>`+
 `<div style="margin-top:8px"><label>بەروار</label><input id="sp_d" type="date" value="${dayKey(new Date())}"></div>`+
 `<button class="go" id="sp_add">${y?'زیادکردن بۆ ناو ساحە':'زیادکردنی ڕۆشتوو'}</button>`);
 if(addOpen){el.innerHTML=h;return}
 h+=sp.length?'<div class="sp">'+sp.map((s,i)=>`<button data-s="${i}" class="${s===sel?'on':''}">${esc(s)}</button>`).join('')+'</div>':'<div class="note">هێشتا هیچ مواسەفاتێک پاشەکەوت نەکراوە.</div>';
 if(sel){const i=sm(sel,'yard','qty'),o=sm(sel,'out','qty'),ls=sm(sel,'loss','qty');
  h+=cards([[`ژمارەی ${p}ی ${esc(sel)} ${y?'(ماوە لە ساحە)':'(ڕۆشتوو)'}`,fmt(y?i-o-ls:o)]],true);
  const G={};en.filter(e=>e.spec===sel&&e.dir===(y?'yard':'out')).forEach(e=>{const g=G[e.date+'|'+(e.sub||'')]??={q:0,t:0};g.q+=e.qty;g.t+=e.tons});
  h+=tbl(y?'تۆمارەکانی داخڵبوو':'تۆمارەکانی ڕۆشتوو',['بەروار','نەوع','عەدەد','تێکڕا','کۆی وەزن',''],Object.keys(G).sort().reverse().map(d=>[d.split('|')[0],subLbl(k,d.split('|')[1])||'-',fmt(G[d].q),(G[d].q?G[d].t/G[d].q:0).toLocaleString('en-US',{maximumFractionDigits:2}),fmt(G[d].t),`<button class="x" data-x="${d}" aria-label="سڕینەوە">${TRASH}</button>`]));
  h+='<button class="go" id="sp_del" style="background:#dc2626">سڕینەوەی ئەم مواسەفاتە</button>'}
 else if(sp.length)h+=y?tbl('هەموو مواسەفاتەکان',['مواسەفات','داخڵبوو','ڕۆشتوو','خەسار','ماوە'],sp.map(s=>[esc(s),fmt(sm(s,'yard','qty')),fmt(sm(s,'out','qty')),fmt(sm(s,'loss','qty')),fmt(sm(s,'yard','qty')-sm(s,'out','qty')-sm(s,'loss','qty'))])):tbl('هەموو مواسەفاتەکان',['مواسەفات','عەدەد','کێش (کگم)'],sp.map(s=>[esc(s),fmt(sm(s,'out','qty')),fmt(sm(s,'out','tons'))]));
 el.innerHTML=h}

function addEntry(){
 const p=[...picks][0],k=KIND[p],s=nz($('sp_n').value),q=+$('sp_q').value;
 const bg=k==='bags';
 if(!s||(bg&&!subSel)){toast(bg?(!s&&!subSel?'جۆری جامبۆ و مواسەفات دیاری بکە':!subSel?'جۆری جامبۆ دیاری بکە':'مواسەفات دیاری بکە'):'مواسەفات دیاری بکە');return}
 if(!(q>0)){toast('عەدەد بنووسە');return}
 const L=D.specs[k]=D.specs[k]||[],name=L.find(x=>x.toLowerCase()===s.toLowerCase())||(L.push(s),s);
 if(+$('sp_t').value>0)D.avg[k+'|'+name]=D.avg[k]=+$('sp_t').value;
 D.manual.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),dir:tab===1?'out':'yard',kind:k,spec:name,qty:q,avg:+$('sp_t').value||0,tons:q*(+$('sp_t').value||0),cars:0,sub:subSel,date:$('sp_d').value||dayKey(new Date())});
 sel=name;save();draw();toast('پاشەکەوت کرا ✓')}

const cards=(a,one,w=1,c3)=>'<div class="cards'+(c3?' c3':'')+'">'+a.map((c,i)=>`<div class="card${(one||i===w)?' wide':''}"><span>${c[0]}</span><b>${c[1]}</b></div>`).join('')+'</div>';
const tbl=(t,h,b)=>`<div class="box">${t?`<h2>${t}</h2>`:''}`+(b.length?`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${b.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`:'<div class="empty">داتا نییە</div>')+'</div>';

// ---- ڕاپۆرتی گشتی (ڕۆشتوو) ----
function report(){
 const inW=win(),f=$('from').value,t=$('to').value;
 const lbl=!f&&!t?'هەموو بەروارەکان':(f&&t&&f===t?f:'لە '+(f||'…')+'  تا  '+(t||'…'));
 const mn=D.manual.filter(e=>e.dir==='out'&&inW(toD(e.date+'T00:00')));
 const mf=done().filter(x=>cls(x.Unit)!=='tanker'&&inW(toD(x.InvoiceDate)));
 const G={barrels:{},bags:{}};
 const put=(k,sub,spec,q,kg)=>{const key=sub+'|'+spec,r=G[k][key]??={sub,spec,q:0,kg:0};r.q+=q;r.kg+=kg};
 mn.forEach(e=>put(e.kind,e.sub||'',e.spec,+e.qty||0,+e.tons||0));
 mf.forEach(x=>{const k=cls(x.Unit);put(k,'','',k==='barrels'?barrelQty(x):(+x.Quantity||0),+x.NetWeight||0)});
 const spn=r=>r.spec?`<span class="spc">${esc(r.spec)}</span>`:'<span style="color:var(--mu)">نەدیاریکراو</span>';
 const sortR=(a,b)=>String(a.spec).localeCompare(String(b.spec),undefined,{numeric:true});
 const tot={barrels:[0,0],bags:[0,0]};
 const sec=(k,title)=>{
  const rows=Object.values(G[k]);rows.forEach(r=>{tot[k][0]+=r.q;tot[k][1]+=r.kg});
  if(!rows.length)return `<div class="box rp"><h3>${title}</h3><div class="none">هیچ داتایەک نییە</div></div>`;
  let h='<tr><th>مواسەفات</th><th>نەوع</th><th>عەدەد</th><th>کێش (کگم)</th></tr>';
  const ord=SORD[k];
  rows.sort((a,b)=>sortR(a,b)||ord.indexOf(a.sub)-ord.indexOf(b.sub)).forEach(r=>h+=`<tr><td>${spn(r)}</td><td>${subLbl(k,r.sub)||'-'}</td><td class="n">${fmt(r.q)}</td><td class="n">${fmt(r.kg)}</td></tr>`);
  h+=`<tr class="tot"><td>کۆی ${NAME[k]}</td><td></td><td>${fmt(tot[k][0])}</td><td>${fmt(tot[k][1])}</td></tr>`;
  return `<div class="box rp"><h3>${title}</h3><table>${h}</table></div>`};
 const b=sec('barrels','🛢 بەرمیل'),g=sec('bags',BAGI+' کیسە');
 const br=Object.values(G.barrels).sort(sortR),bg=Object.values(G.bags);
 reportRows=[];reportLbl=lbl;
 SORD.barrels.forEach(sb=>br.filter(r=>r.sub===sb).forEach(r=>reportRows.push({k:'row',type:'بەرمیل',sub:subLbl('barrels',sb),spec:r.spec,q:r.q,kg:r.kg})));
 if(br.length)reportRows.push({k:'tot',type:'کۆی بەرمیل',spec:'',q:tot.barrels[0],kg:tot.barrels[1]});
 SORD.bags.forEach(sb=>bg.filter(r=>r.sub===sb).sort(sortR).forEach(r=>reportRows.push({k:'row',type:'کیسە',sub:subLbl('bags',sb),spec:r.spec,q:r.q,kg:r.kg})));
 if(bg.length)reportRows.push({k:'tot',type:'کۆی کیسە',spec:'',q:tot.bags[0],kg:tot.bags[1]});
 reportRows.push({k:'all',type:'کۆی گشتی',spec:'',q:tot.barrels[0]+tot.bags[0],kg:tot.barrels[1]+tot.bags[1]});
 {const F='\u2068',P='\u2069',R='\u200F',c=v=>F+v+P,LN='──────────────',J=' ┃ ',L=[R+'*📋 ڕاپۆرتی گشتی ڕۆشتوو*',R+'📅 '+c(lbl),LN,R+'*'+['جۆری بار','نەوع/جۆر','عەدەد','کێش (کگم)'].map(c).join(J)+'*',LN];
  reportRows.forEach(r=>{const ty=r.type,sp=r.k==='row'?(r.spec||'نەدیاریکراو')+(r.sub?' ('+r.sub+')':''):'—',b=r.k==='row'?'':'*',
   cells=[c(ty),c(sp),c(fmt(r.q)),c(fmt(r.kg)+(r.k==='all'?' کگم':''))].join(J);L.push(R+b+cells+b);if(r.k==='tot')L.push(LN)});
  reportText=L.join('\n')}
 const shareBox=`<div class="box rp"><h3>📤 ناردنی ڕاپۆرت</h3><div class="sh"><div class="r3"><button class="b-wa" data-sh="wa">وەتس ئەپ 📄</button><button class="b-tg" data-sh="tg">تێلیگرام</button><button class="b-vb" data-sh="vb">ڤایبەر</button></div></div></div>`;
 return `<div class="box rp"><div class="ttl"><b>📋 ڕاپۆرتی گشتی ڕۆشتوو</b><span>${lbl}</span></div></div>`+
  cards([['کۆی کێشی (کگم) ڕۆشتوو',fmt(tot.barrels[1]+tot.bags[1])],['کۆی بەرمیل',fmt(tot.barrels[0])],['کۆی کیسە',fmt(tot.bags[0])]],false,-1,true)+b+g+shareBox}

// ---- خەساربوو (کیسە / بەرمیلی خەسارچوو لە ساحە) ----
let lossOn=false,lossK='',lossSpec='',lossSub='',lossQ='',lossD='';
function lossView(){
 const k=lossK,bg=k==='bags',spl=k?(D.specs[k]||[]):[],bt=(a,on,t)=>`<button type="button" ${a} class="${on?'on':''}">${t}</button>`;
 let h='<div class="panel lossp"><h2 style="color:#b45309">⚠️ خەساربوو</h2><label>١) جۆری خەساربوو</label><div class="sp">'+
  [['bags','کیسە'],['barrels','بەرمیل']].map(x=>bt('data-lk="'+x[0]+'"',k===x[0],x[1])).join('')+'</div>';

  if(lossSpec&&(!bg||lossSub)){

   h+=cards([['ماوە لە ساحە ('+esc(lossSpec)+(lossSub?' · '+SUBS(k)[lossSub]:'')+')',fmt(stock)]],true)+

    '<button class="go" id="ls_ok">تۆمارکردن</button>'}
 }
 h+='</div>';
 const L=D.manual.filter(e=>e.dir==='loss').slice().reverse().sort((a,b)=>String(b.date).localeCompare(String(a.date))),
  tot={barrels:[0,0],bags:[0,0]};
 L.forEach(e=>{const a=tot[e.kind];if(a){a[0]+=e.qty;a[1]+=e.tons}});
 h+=cards([['کۆی کێشی خەسار (کگم)',fmt(tot.barrels[1]+tot.bags[1])],['کۆی بەرمیل',fmt(tot.barrels[0])],['کۆی کیسە',fmt(tot.bags[0])]],false,-1,true);
 h+=tbl('تۆمارەکانی خەساربوو',['بەروار','جۆر','مواسەفات','نەوع','عەدەد',''],L.slice(0,60).map(e=>[esc(e.date),NAME[e.kind]||'',esc(e.spec),subLbl(e.kind,e.sub)||'-',fmt(e.qty),`<button class="x" data-lx="${esc(e.id)}" aria-label="سڕینەوە">${TRASH}</button>`]));
 return h}
function addLoss(){
 const k=lossK,bg=k==='bags';
 if(!k){toast('جۆری خەساربوو دیاری بکە');return}
 if(!lossSpec){toast('مواسەفات دیاری بکە');return}
 if(bg&&!lossSub){toast('جۆری جامبۆ دیاری بکە');return}
 const q=+($('ls_q')?$('ls_q').value:lossQ);
 if(!(q>0)){toast('عەدەدی خەساربوو بنووسە');return}
 const av=+(D.avg[k+'|'+lossSpec]??D.avg[k]??0)||0;
 D.manual.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),dir:'loss',kind:k,spec:lossSpec,qty:q,avg:av,tons:q*av,cars:0,sub:lossSub,date:($('ls_d')&&$('ls_d').value)||dayKey(new Date())});
 lossQ='';save();draw();toast('خەسار تۆمار کرا ✓')}
$('view').addEventListener('click',e=>{if(!lossOn)return;const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.lk){lossK=lossK===d.lk?'':d.lk;lossSpec='';lossSub='';lossQ='';return draw()}
 if(d.ls!==undefined){const v=(D.specs[lossK]||[])[+d.ls];lossSpec=lossSpec===v?'':v;return draw()}
 if(d.lsub){lossSub=lossSub===d.lsub?'':d.lsub;return draw()}
 if(t.id==='ls_ok')return addLoss();
 if(d.lx){const id=d.lx;ask('دەتەوێت ئەم داتایە بسڕیتەوە؟',()=>{D.manual=D.manual.filter(m=>m.id!==id);save();draw()})}});
$('view').addEventListener('input',e=>{if(e.target.id==='ls_q')lossQ=e.target.value;if(e.target.id==='ls_d')lossD=e.target.value});

const ic=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;

function mergeRemote(D,R,prev){

<script>
/* auto-update: new code from GitHub reaches the phone without reinstalling */
if('serviceWorker' in navigator){
 let hadSW=false,reloading=false,h0=null;
 const hash=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return h};
 const grab=()=>fetch('index.html',{cache:'no-store'}).then(r=>r.ok?r.text():null).then(t=>t?hash(t):null).catch(()=>null);
 const reload=()=>{if(reloading)return;reloading=true;location.reload()};
 const busy=()=>{try{return !!addOpen}catch(e){return false}};
 const check=async(reg)=>{
  try{reg&&reg.update()}catch(e){}
  const h=await grab();
  if(h===null)return;
  if(h0===null){h0=h;return}
  if(h!==h0){ if(busy()){return} reload() }
 };
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!busy())reload()});
 addEventListener('load',()=>{
  hadSW=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
   grab().then(h=>{h0=h});
   document.addEventListener('visibilitychange',()=>{if(!document.hidden)check(reg)});
   setInterval(()=>check(reg),20*60*1000);
  }).catch(()=>{});
 });
}
</script>
