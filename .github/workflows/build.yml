name: Build APK
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q StatisticsApp.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle -p StatisticsApp assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: statistics-apk
          path: StatisticsApp/app/build/outputs/apk/debug/app-debug.apk
